 .modal h2 .dot{display:inline-block;margin-right:8px}

const MAP=DETAILS.reduce((m,o)=>(m[o.domain]=o,m),{});
const br=s=>/^\d{4}-/.test(s||"")?s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4):(s||"—");
const esc=s=>String(s==null?"—":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))||"—";
const FIELDS=[["published","Publicado em",br],["expires","Expira em",br],["registrar","Registrador"],
 ["nameservers","Nameservers (Cloudflare)"],["ip","IP (Cloudflare)"],["cert_issuer","Certificado"],
 ["cert_expires","Validade do certificado"],["backend","Backend de pagamento"],["prefix","Prefixo"],["status","Situação"]];
const ov=document.getElementById("ov"),md=document.getElementById("md");
function show(dom){
 const o=MAP[dom]||{domain:dom};
 let rows="";
 for(const [k,label,fn] of FIELDS){let v=o[k]; if(v==null||v===""||v==="?")continue; rows+="<dt>"+label+"</dt><dd>"+esc(fn?fn(v):v)+"</dd>";}
 md.innerHTML='<button class="x" onclick="hide()">&times;</button>'+
   '<h2><span class="dot"></span>'+esc(dom)+'</h2><dl>'+rows+'</dl>';
 ov.classList.add("on");
}
function hide(){ov.classList.remove("on");}
ov.addEventListener("click",e=>{if(e.target===ov)hide();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hide();});
document.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>show(c.dataset.d)));
